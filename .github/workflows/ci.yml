name: Gravity Fitness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install application dependencies
        run: python -m pip install -e ".[firebase]"
      - name: Compile Python
        run: python -m compileall -q server
      - name: Run foundation tests
        run: python scripts/ci-unittest.py
      - name: Check browser JavaScript
        shell: bash
        run: |
          for file in web/js/*.js; do
            node --check "$file"
          done

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install application dependencies
        run: python -m pip install -e "."
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser release gates
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gravity-browser-evidence
          path: |
            .gravity/playwright-artifacts
            playwright-report
          if-no-files-found: ignore
